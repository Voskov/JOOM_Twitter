# Alembic configuration file.
# env.py overrides sqlalchemy.url at runtime using app.config.settings.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for create_date in new migration files
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to "true" to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# Set to "true" to allow .pyc and .pyo files without a source .py file
sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = %(here)s/alembic/versions

# the output encoding used when revision files are written from
# script.py.mako
output_encoding = utf-8

# Placeholder — overridden by env.py at runtime
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
